spring:
  application:
    name: vision-aids-store
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vision_aids}
    username: ${DB_USERNAME:vision_aids}
    password: ${DB_PASSWORD:vision_aids}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
logging:
  level:
    # Validation exception messages contain rejected personal details at DEBUG.
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO
    # REVIEW: Stripe's raw webhook JSON can include billing details. Never log bodies.
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
checkout:
  frontend-url: ${CHECKOUT_FRONTEND_URL:http://localhost:3000}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
