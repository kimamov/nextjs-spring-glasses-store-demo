openapi: 3.0.3
info:
  title: Vision Aids Store API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/checkout/orders:
    post:
      operationId: savePendingCheckout
      summary: Save or update a guest's pending order
      description: One frame with free demo shipping within Germany. First save snapshots the catalog name/price; retries preserve the snapshot and update contact/address details. An atomic upsert reuses the order per guest/product. No payment is taken.
      parameters:
        - $ref: '#/components/parameters/CheckoutToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Pending order committed; private details must not be cached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOrderDto'
        '400':
          description: Invalid details or malformed request; field validation failures include an errors map
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: string
        '404':
          description: Selected product no longer exists
        '401':
          description: Missing or malformed checkout identity
        '409':
          description: Order can no longer be modified
        '410':
          description: Pending order expired
  /api/v1/checkout/orders/current:
    get:
      operationId: currentCheckout
      summary: Restore this guest's pending order and address
      parameters:
        - $ref: '#/components/parameters/CheckoutToken'
        - name: productId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Guest-owned pending order; Cache-Control is no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOrderDto'
        '401':
          description: Missing or malformed checkout identity
        '404':
          description: No pending order belongs to this guest and product
        '410':
          description: Pending order expired
  /api/v1/products:
    get:
      operationId: listProducts
      summary: List the demo catalog ordered by product name
      description: Filters run in the database. Choices within a brand or shape group match any value; different groups combine with AND.
      parameters:
        - name: cat
          in: query
          required: false
          description: Filter by product type. Omit to return all products.
          schema:
            type: string
            enum: [eyeglasses, sunglasses, reading-glasses, sports-glasses]
        - name: brand
          in: query
          description: Brand choices from /api/v1/products/filters. Comma-separated or repeated values are supported.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: shape
          in: query
          description: Frame shape choices from /api/v1/products/filters. Comma-separated or repeated values are supported.
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: minPrice
          in: query
          description: Inclusive minimum EUR price in decimal notation, with at most two decimal places. Omit for no lower bound.
          schema:
            type: number
            minimum: 0
            multipleOf: 0.01
        - name: maxPrice
          in: query
          description: Inclusive maximum EUR price in decimal notation, with at most two decimal places. Must be at least minPrice. Omit for no upper bound.
          schema:
            type: number
            minimum: 0
            multipleOf: 0.01
      responses:
        '200':
          description: Matching products, or an empty array when none match
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductSummaryDto'
        '400':
          description: Invalid or unavailable filter choices, invalid decimal prices, or a minimum price exceeding the maximum
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  detail:
                    type: string
  /api/v1/products/{id}:
    get:
      operationId: getProduct
      summary: Find a product by ID with its complete image gallery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product details, including all images in stored order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailDto'
        '400':
          description: The ID is not a valid UUID
        '404':
          description: No product exists with this ID
  /api/v1/products/filters:
    get:
      operationId: productFilterOptions
      summary: Available catalog filter choices, independent of current selections
      responses:
        '200':
          description: Supported types and distinct brands and shapes from the complete catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductFilterOptionsDto'
components:
  parameters:
    CheckoutToken:
      name: X-Checkout-Token
      in: header
      required: true
      description: Secret random token forwarded by Next.js from the HttpOnly guest cookie. Never put it in a URL or log it. Order access expires after 24 hours.
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
  schemas:
    CheckoutRequest:
      type: object
      required: [productId, firstName, lastName, email, street, postalCode, city, country]
      properties:
        productId:
          type: string
          format: uuid
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        street:
          type: string
          minLength: 1
          maxLength: 200
        addressLine2:
          type: string
          nullable: true
          maxLength: 200
        postalCode:
          type: string
          pattern: '^[0-9]{5}$'
        city:
          type: string
          minLength: 1
          maxLength: 100
        country:
          type: string
          enum: [DE]
    CheckoutOrderDto:
      type: object
      required: [orderId, status, productId, productName, total, currency, details]
      properties:
        orderId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING_PAYMENT]
        productId:
          type: string
          format: uuid
        productName:
          type: string
        total:
          type: number
          minimum: 0
          description: Snapshotted price of one frame, including free demo shipping
        currency:
          type: string
          example: EUR
        details:
          $ref: '#/components/schemas/CheckoutRequest'
    ProductFilterOptionsDto:
      type: object
      required: [types, brands, shapes]
      properties:
        types:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
                example: eyeglasses
              label:
                type: string
                example: Eyeglasses
        brands:
          type: array
          uniqueItems: true
          items:
            type: string
        shapes:
          type: array
          uniqueItems: true
          items:
            type: string
    ProductSummaryDto:
      type: object
      required: [id, slug, name, brand, type, shape, color, price, currency, mainThumbnail, rotatingThumbnails]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: mitte
        name:
          type: string
          example: Mitte
        brand:
          type: string
          example: Vision Aids
        type:
          type: string
          enum: [eyeglasses, sunglasses, reading-glasses, sports-glasses]
          example: eyeglasses
        shape:
          type: string
          example: Round
        color:
          type: string
          example: Tortoiseshell
        price:
          type: number
          minimum: 0
          description: Frame-only price in major currency units
          example: 89.00
        currency:
          type: string
          example: EUR
        mainThumbnail:
          type: object
          nullable: true
          description: Selected main image, or null when the product has no images.
          required: [url, altText, width, height]
          properties:
            url:
              type: string
            altText:
              type: string
            width:
              type: integer
              minimum: 1
            height:
              type: integer
              minimum: 1
        rotatingThumbnails:
          type: array
          description: Selected rotation images in gallery order. May be empty. Includes the main image only if it is also selected for rotation.
          items:
            $ref: '#/components/schemas/ProductImageDto'
    ProductDetailDto:
      description: Product details returned by the ID lookup endpoint.
      allOf:
        - $ref: '#/components/schemas/ProductSummaryDto'
        - type: object
          required: [images]
          properties:
            images:
              type: array
              description: Complete gallery in stored order, including images not selected for thumbnails.
              items:
                $ref: '#/components/schemas/ProductImageDto'
    ProductImageDto:
      type: object
      required: [url, altText, width, height]
      properties:
        url:
          type: string
          description: Image URL; sample images use paths relative to the storefront origin.
          example: /images/products/brille-02-havanna-bild-01.png
        altText:
          type: string
          description: Accessible description of this image.
        width:
          type: integer
          minimum: 1
          description: Intrinsic width of the source file in pixels, independent of rendered size.
          example: 500
        height:
          type: integer
          minimum: 1
          description: Intrinsic height of the source file in pixels, independent of rendered size.
          example: 332
