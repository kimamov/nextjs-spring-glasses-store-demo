openapi: 3.0.3
info:
  title: Vision Aids Store API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/products:
    get:
      operationId: listProducts
      summary: List the demo catalog ordered by product name
      parameters:
        - name: cat
          in: query
          required: false
          description: Filter by product type. Omit to return all products.
          schema:
            type: string
            enum: [eyeglasses, sunglasses, reading-glasses, sports-glasses]
      responses:
        '200':
          description: Matching products, or an empty array when none match
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductSummaryDto'
        '400':
          description: Unsupported product type, including an empty cat value
components:
  schemas:
    ProductSummaryDto:
      type: object
      required: [id, slug, name, brand, type, shape, color, price, currency, mainThumbnail, rotatingThumbnails]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          example: mitte
        name:
          type: string
          example: Mitte
        brand:
          type: string
          example: Vision Aids
        type:
          type: string
          enum: [eyeglasses, sunglasses, reading-glasses, sports-glasses]
          example: eyeglasses
        shape:
          type: string
          example: Round
        color:
          type: string
          example: Tortoiseshell
        price:
          type: number
          minimum: 0
          description: Frame-only price in major currency units
          example: 89.00
        currency:
          type: string
          example: EUR
        mainThumbnail:
          type: object
          nullable: true
          description: Selected main image, or null when the product has no images.
          required: [url, altText, width, height]
          properties:
            url:
              type: string
            altText:
              type: string
            width:
              type: integer
              minimum: 1
            height:
              type: integer
              minimum: 1
        rotatingThumbnails:
          type: array
          description: Selected rotation images in gallery order. May be empty. Includes the main image only if it is also selected for rotation.
          items:
            $ref: '#/components/schemas/ProductImageDto'
    ProductDetailDto:
      description: Detail DTO prepared for a future detail endpoint; no detail route is currently exposed.
      allOf:
        - $ref: '#/components/schemas/ProductSummaryDto'
        - type: object
          required: [images]
          properties:
            images:
              type: array
              description: Complete gallery in stored order, including images not selected for thumbnails.
              items:
                $ref: '#/components/schemas/ProductImageDto'
    ProductImageDto:
      type: object
      required: [url, altText, width, height]
      properties:
        url:
          type: string
          description: Image URL; sample images use paths relative to the storefront origin.
          example: /images/products/misterspex-6536001-a.jpg
        altText:
          type: string
          description: Accessible description of this image.
        width:
          type: integer
          minimum: 1
          description: Intrinsic width of the source file in pixels, independent of rendered size.
          example: 500
        height:
          type: integer
          minimum: 1
          description: Intrinsic height of the source file in pixels, independent of rendered size.
          example: 332
