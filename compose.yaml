services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vision_aids
      POSTGRES_USER: vision_aids
      POSTGRES_PASSWORD: vision_aids
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vision_aids -d vision_aids"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/vision_aids
      DB_USERNAME: vision_aids
      DB_PASSWORD: vision_aids
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
